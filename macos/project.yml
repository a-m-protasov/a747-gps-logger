name: A747
options:
  bundleIdPrefix: io.github.a_m_protasov
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
packages:
  A747Core:
    path: A747Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  A747:
    type: application
    platform: macOS
    sources:
      - path: A747
      - path: ../shared/timezones.bin
        buildPhase: resources
      - path: ../shared/map/map.html
        buildPhase: resources
      - path: ../shared/map/maplibre-gl.js
        buildPhase: resources
      - path: ../shared/map/maplibre-gl.css
        buildPhase: resources
    dependencies:
      - package: A747Core
    settings:
      base:
        PRODUCT_NAME: A747 GPS Logger
        PRODUCT_BUNDLE_IDENTIFIER: io.github.a_m_protasov.a747
        CODE_SIGN_ENTITLEMENTS: A747/A747.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: A747 GPS Logger
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License. Not affiliated with TranSystem."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
