<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27A383"/>
      <stop offset="1" stop-color="#0F5C4A"/>
    </linearGradient>
    <linearGradient id="dev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55585E"/><stop offset="1" stop-color="#2E3034"/></linearGradient>
    <radialGradient id="btn" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#5A5D63"/><stop offset="0.6" stop-color="#1A1B1D"/><stop offset="1" stop-color="#0E0F10"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- contour lines -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6">
    <path d="M100 330 C 300 260, 420 420, 620 340 S 860 260, 924 300"/>
    <path d="M100 470 C 280 400, 440 560, 640 470 S 860 400, 924 440"/>
    <path d="M100 760 C 300 700, 460 840, 660 760 S 860 700, 924 740"/>
  </g>
  <!-- track -->
  <path d="M230 760 C 300 640, 420 700, 470 600 S 420 420, 560 380 S 760 420, 790 270"
        fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="230" cy="760" r="34" fill="#ffffff"/>
  <circle cx="230" cy="760" r="16" fill="#1F8A70"/>
  <!-- waypoint -->
  <g transform="translate(790 270)">
    <path d="M0 0 C -60 -70, -70 -120, 0 -150 C 70 -120, 60 -70, 0 0 Z" fill="#F2994A" filter="url(#sh)"/>
    <circle cx="0" cy="-100" r="22" fill="#ffffff"/>
  </g>
  <!-- logger -->
  <g transform="translate(520 560) rotate(-12)" filter="url(#sh)">
    <rect x="0" y="0" width="230" height="330" rx="46" fill="#17181A"/>
    <rect x="14" y="14" width="202" height="302" rx="36" fill="url(#dev)"/>
    <!-- satellite mark -->
    <g transform="translate(115 108)" fill="none" stroke="#C9CCD1" stroke-width="3" opacity="0.85">
      <ellipse rx="13" ry="5" transform="rotate(35)"/><ellipse rx="13" ry="5" transform="rotate(-35)"/><circle r="2.5" fill="#C9CCD1"/>
    </g>
    <!-- arc under the button -->
    <path d="M62 236 Q115 278 168 236" fill="none" stroke="#1E1F22" stroke-width="3"/>
    <!-- LEDs: top amber, left blue, right red (symmetric) -->
    <ellipse cx="115" cy="160" rx="9" ry="22" fill="#FFB020" filter="url(#glow)"/>
    <ellipse cx="62" cy="222" rx="24" ry="9" fill="#2F6BFF" filter="url(#glow)"/>
    <ellipse cx="168" cy="222" rx="24" ry="9" fill="#FF3B30" filter="url(#glow)"/>
    <!-- button -->
    <circle cx="115" cy="218" r="20" fill="url(#btn)" stroke="#0B0B0C" stroke-width="2"/>
    <ellipse cx="109" cy="211" rx="8" ry="4" fill="#ffffff" opacity="0.35"/>
    <!-- bluetooth and battery marks -->
    <path d="M52 262 l12 10 -6 5 v-22 l6 5 -12 10" fill="none" stroke="#C9CCD1" stroke-width="2.5" stroke-linejoin="round" opacity="0.85"/>
    <g fill="none" stroke="#C9CCD1" stroke-width="2.5" opacity="0.85"><rect x="166" y="257" width="12" height="20" rx="2"/><path d="M169 254 h6"/><path d="M169 263 h6 M169 268 h6 M169 273 h6"/></g>
  </g>
</svg>
