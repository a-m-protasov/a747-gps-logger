<!doctype html>
<!-- Map page shared by the macOS and Android apps. Tiles: OpenFreeMap (no key). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="maplibre-gl.css">
<script src="maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #e9e7e2; }
  /* absolute, not height:100%: Android WebView may lay the page out at 0 px height first */
  #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .wpt { width: 14px; height: 14px; border-radius: 50%; background: #F2994A;
         border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  /* a waypoint with an icon (an emoji) chosen by the user */
  .wpt.icon { width: 26px; height: 26px; background: #fff; border: 2px solid #F2994A;
              display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1;
              font-family: 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
  /* the place a new waypoint goes when picking */
  #cross { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
           display: none; pointer-events: none; }
  #cross::before, #cross::after { content: ''; position: absolute; background: #F2994A;
           box-shadow: 0 0 0 1.5px #fff; border-radius: 1px; }
  #cross::before { left: 21px; top: 0; width: 2px; height: 44px; }
  #cross::after { top: 21px; left: 0; height: 2px; width: 44px; }
  .maplibregl-ctrl-attrib { font: 11px -apple-system, Roboto, sans-serif; }
  #legend { position: absolute; right: 10px; bottom: 34px; display: none; align-items: center; gap: 6px;
            padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,.85);
            font: 11px -apple-system, Roboto, sans-serif; color: #333; }
  #legend .bar { width: 70px; height: 6px; border-radius: 3px;
                 background: linear-gradient(90deg, hsl(0,85%,47%), hsl(60,85%,47%), hsl(120,85%,37%)); }
</style>
</head>
<body>
<div id="map"></div>
<div id="cross"></div>
<div id="legend"><span id="lmin"></span><span class="bar"></span><span id="lmax"></span></div>
<script>
// The map stays light in the apps' dark theme too: the dark style hides too much detail.
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [0, 20], zoom: 1, attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
map.addControl(new maplibregl.ScaleControl(), 'bottom-left');

let last = null, ready = false, markers = [], ranges = [];
const ACCENT = '#1F8A70';

/** Red (slowest) to green (fastest) for t in 0..1. */
const speedColor = t => `hsl(${Math.round(120 * t)}, 85%, ${Math.round(47 - 10 * t)}%)`;

/**
 * Line features for one track. By speed: the track is cut into short pieces, each coloured by
 * its mean speed relative to the track's own min..max (pieces smooth out GPS noise).
 */
function trackFeatures(t, style) {
  const c = Array.isArray(t) ? t : t.c;
  const sp = Array.isArray(t) ? null : t.s;
  if (style.mode !== 'speed' || !sp || sp.length !== c.length || c.length < 3) {
    return [{ type: 'Feature', properties: { color: style.color || ACCENT },
              geometry: { type: 'LineString', coordinates: c } }];
  }
  const step = Math.max(2, Math.round(c.length / 300));
  const pieces = [];
  for (let i = 0; i < c.length - 1; i += step) {
    const j = Math.min(c.length - 1, i + step);
    let sum = 0;
    for (let k = i; k <= j; k++) sum += sp[k];
    pieces.push({ from: i, to: j, v: sum / (j - i + 1) });
  }
  const vs = pieces.map(p => p.v);
  const lo = Math.min(...vs), hi = Math.max(...vs);
  ranges.push([lo, hi]);
  return pieces.map(p => ({
    type: 'Feature',
    properties: { color: speedColor(hi - lo < 0.5 ? 1 : (p.v - lo) / (hi - lo)) },
    geometry: { type: 'LineString', coordinates: c.slice(p.from, p.to + 1) },
  }));
}

function apply(d) {
  for (const m of markers) m.remove();
  markers = [];
  const style = d.style || { mode: 'solid', color: ACCENT };
  ranges = [];
  const features = (d.tracks || []).flatMap(t => trackFeatures(t, style));
  const src = map.getSource('tracks');
  const data = { type: 'FeatureCollection', features };
  if (src) src.setData(data); else {
    map.addSource('tracks', { type: 'geojson', data });
    map.addLayer({ id: 'tracks-casing', type: 'line', source: 'tracks',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#ffffff', 'line-width': 7, 'line-opacity': 0.9 } });
    map.addLayer({ id: 'tracks', type: 'line', source: 'tracks',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': ['get', 'color'], 'line-width': 4 } });
  }
  const legend = document.getElementById('legend');
  if (style.mode === 'speed' && ranges.length === 1 && style.unit) {
    const f = v => Math.round(v * (style.factor || 1)) + ' ' + style.unit;
    document.getElementById('lmin').textContent = f(ranges[0][0]);
    document.getElementById('lmax').textContent = f(ranges[0][1]);
    legend.style.display = 'flex';
  } else legend.style.display = 'none';
  for (const w of d.waypoints || []) {
    const el = document.createElement('div');
    el.className = w.icon ? 'wpt icon' : 'wpt';
    if (w.icon) el.textContent = w.icon;
    markers.push(new maplibregl.Marker({ element: el })
      .setLngLat([w.lon, w.lat]).setPopup(new maplibregl.Popup({ offset: 10 }).setText(w.name))
      .addTo(map));
  }
  const pts = features.flatMap(f => f.geometry.coordinates)
    .concat((d.waypoints || []).map(w => [w.lon, w.lat]));
  if (pts.length) {
    const b = pts.reduce((b, p) => b.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
    // a single waypoint: close enough to see the street, far enough to see where it is
    map.fitBounds(b, { padding: { top: 40, left: 40, right: 40, bottom: 40 + (d.bottomInset || 0) }, maxZoom: pts.length === 1 ? 15 : 16, duration: 0 });
  }
}

// Called by the app:
// setData({tracks: [{c: [[lon, lat], ...], s: [kmh, ...]}, ...] (or plain coordinate arrays),
//          waypoints: [{lon, lat, name, icon}] (icon: an emoji or absent),
//          bottomInset: px kept free at the bottom when fitting (buttons over the map),
//          style: {mode: 'speed' | 'solid', color: '#RRGGBB', unit: 'km/h', factor: 1}})
// The legend (one track, by speed) shows the slowest and fastest piece in `unit` (km/h × factor).
window.setData = d => { last = d; if (ready) apply(d); };
// style.load, not load: load waits for every tile, which can take seconds
map.on('style.load', () => { ready = true; if (last) apply(last); });
// Picking a place for a new waypoint: a cross marks the centre of the map.
window.setPicking = on => { document.getElementById('cross').style.display = on ? 'block' : 'none'; };
// moves the map to a place, close enough to see the street
window.goTo = (lat, lon) => map.jumpTo({ center: [lon, lat], zoom: Math.max(map.getZoom(), 16) });
// [lat, lon] of the centre
window.center = () => { const c = map.getCenter().wrap(); return [c.lat, c.lng]; };
map.on('error', e => console.log('map error: ' + (e && e.error ? e.error.message : e)));
addEventListener('resize', () => map.resize());
</script>
</body>
</html>
